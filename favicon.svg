<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="64" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2.5" />

  <!-- Subtle Financial Market Chart Bars in Background -->
  <rect x="12" y="38" width="4" height="14" rx="1.5" fill="#334155" opacity="0.6" />
  <rect x="20" y="30" width="4" height="22" rx="1.5" fill="#334155" opacity="0.6" />
  <rect x="28" y="24" width="4" height="28" rx="1.5" fill="#334155" opacity="0.6" />
  <rect x="36" y="20" width="4" height="32" rx="1.5" fill="url(#barGrad)" opacity="0.8" />
  <rect x="44" y="14" width="4" height="38" rx="1.5" fill="url(#cyanGrad)" />

  <!-- Trending Delta Line -->
  <path d="M12 40 L22 32 L30 26 L38 22 L46 14" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Glowing Modern Geometric 'D' Monogram Overlay -->
  <path d="M18 16 H31 C40.5 16 47 22.5 47 32 C47 41.5 40.5 48 31 48 H18 V16 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M18 16 H31 C40.5 16 47 22.5 47 32 C47 41.5 40.5 48 31 48 H18 V16 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Core Pulse / Data Node -->
  <circle cx="46" cy="14" r="3" fill="#22D3EE" filter="url(#glow)" />
  <circle cx="46" cy="14" r="1.5" fill="#FFFFFF" />
</svg>
